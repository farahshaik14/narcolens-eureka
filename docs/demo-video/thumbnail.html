<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;position:relative;overflow:hidden;background:#050a14;font-family:Inter,Arial,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:url(thumb_bg.png) center/cover no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,10,20,.88) 0%,rgba(5,10,20,.55) 38%,rgba(5,10,20,0) 58%)}
.wrap{position:absolute;left:96px;top:0;bottom:0;width:740px;display:flex;flex-direction:column;justify-content:center}
.tag{align-self:flex-start;font:700 26px/1 "JetBrains Mono",monospace;letter-spacing:.2em;color:#22d3ee;border:2px solid rgba(34,211,238,.6);background:rgba(34,211,238,.12);padding:14px 22px;border-radius:999px;margin-bottom:34px}
h1{font-size:132px;line-height:.95;font-weight:800;letter-spacing:-.01em;text-shadow:0 8px 40px rgba(0,0,0,.6)}
h2{font-size:54px;line-height:1.1;font-weight:700;color:#22d3ee;margin-top:18px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.sub{font-size:34px;line-height:1.3;color:#e2e8f0;margin-top:26px;max-width:700px;text-shadow:0 4px 20px rgba(0,0,0,.6)}
.chips{display:flex;gap:18px;margin-top:44px}
.chip{font:700 25px/1 "JetBrains Mono",monospace;letter-spacing:.14em;padding:16px 24px;border-radius:12px;background:rgba(5,10,20,.85)}
.c1{color:#22d3ee;border:2px solid #22d3ee}.c2{color:#10b981;border:2px solid #10b981}
.play{position:absolute;right:150px;bottom:150px;width:150px;height:150px;border-radius:50%;background:rgba(34,211,238,.92);box-shadow:0 0 60px rgba(34,211,238,.6);display:grid;place-items:center}
.play:after{content:"";margin-left:12px;border-left:46px solid #050a14;border-top:28px solid transparent;border-bottom:28px solid transparent}
.note{position:absolute;right:48px;bottom:34px;font:600 22px/1 "JetBrains Mono",monospace;letter-spacing:.12em;color:#94a3b8;background:rgba(5,10,20,.7);padding:10px 16px;border-radius:8px}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="wrap">
  <div class="tag">FULL PROTOTYPE DEMO</div>
  <h1>NarcoLens</h1>
  <h2>From Scan to Evidence.</h2>
  <div class="sub">AI-assisted substance screening for police &amp; airport customs</div>
  <div class="chips"><span class="chip c1">INSPECTOR MODE</span><span class="chip c2">SUPERVISOR MODE</span></div>
</div>
<div class="play"></div>
<div class="note">SIMULATED DATA</div>
</body></html>
